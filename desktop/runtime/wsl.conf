# DockPanel Desktop - WSL2 Micro-Distribution Configuration
# Controls instance boot, networking, and Windows interoperability.
# Ref: https://learn.microsoft.com/en-us/windows/wsl/wsl-config

[boot]
# Enable systemd as PID 1 to support native Linux daemons
# (Nginx, PHP 8.1-8.4 FPM, MariaDB, PostgreSQL, Mailpit, DockPanel API & Agent)
systemd=true

[network]
# Prevent WSL2 from auto-generating /etc/hosts from Windows hosts file.
# Local domains (.test / .local) are managed via DockPanelHostHelper.
generateHosts=false

# Keep DNS resolution synchronized with the Windows host resolver
generateResolvConf=true

[interop]
# Allow execution of Windows binaries and interop commands
enabled=true

# Prevent Windows %PATH% from polluting Linux environment and conflicting with native tools
appendWindowsPath=false
