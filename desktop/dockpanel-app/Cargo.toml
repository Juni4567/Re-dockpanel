[package]
name = "dockpanel-app"
version = "2.253.0"
edition = "2021"
description = "DockPanel Desktop - Native Pure Rust Windows Application"

[dependencies]
tao = "0.30"
wry = "0.47"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls = "0.23"
rustls-pki-types = "1"
tokio-rustls = "0.26"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = "0.5"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"

[build-dependencies]
winres = "0.1"

[[bin]]
name = "dockpanel"
path = "src/main.rs"
